name: Specs
on:
  - push
  - pull_request
permissions:
  contents: read
jobs:
  # Docs-only changes skip the jobs below; CI Success still reports success
  changes:
    uses: ./.github/workflows/ci_changes.yml

  specs:
    name: Specs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    runs-on: ubuntu-latest
    # Unit specs finish in under a minute; fail fast instead of letting a
    # wedged runner occupy the job slot for the 6-hour default
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: |
          # Run rspec directly (not via rake) so $SPEC_PID is the ruby process
          # itself — the USR1 watchdog below sends the signal to that pid, and
          # spec_helper registers a USR1 handler that prints a thread dump.
          # Running via 'bundle exec rake spec' would send the signal to rake,
          # which has no USR1 handler and would crash before the dump appears.
          bundle exec rspec --format documentation &
          SPEC_PID=$!
          # Send USR1 after 8 minutes so the thread-dump handler in spec_helper
          # prints a backtrace before the 10-minute job timeout kills everything.
          ( sleep 480
            if kill -0 $SPEC_PID 2>/dev/null; then
              echo "=== specs still running after 8 minutes — requesting thread dump ==="
              kill -USR1 $SPEC_PID 2>/dev/null || true
              sleep 5
            fi
          ) &
          WATCHDOG_PID=$!
          wait $SPEC_PID
          EXIT_CODE=$?
          kill $WATCHDOG_PID 2>/dev/null || true
          exit $EXIT_CODE

  integrations:
    name: Integrations
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    runs-on: ubuntu-latest
    # Integration specs normally take ~4 minutes
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start ElasticMQ
        run: docker compose up -d

      - name: Wait for ElasticMQ
        run: |
          timeout 30s bash -c '
          until curl -s http://localhost:9324/health; do
            echo "Waiting for ElasticMQ..."
            sleep 1
          done
          '

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run integration specs
        run: bundle exec rake spec:integration

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - specs
      - integrations
    steps:
      # Skipped jobs are fine only when the change is docs-only
      - name: Check all jobs passed
        if: |
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        run: exit 1
      - run: echo "All CI checks passed!"
