require:
  - ./rubocop/cops/multiline_method_call_parentheses

AllCops:
  Exclude:
    - '**/Gemfile'
  TargetRubyVersion: 3.3

Metrics/BlockLength:
  AllowedMethods:
    - describe
    - context
  CountAsOne:
    - method_call

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  # Disable "Assignment Branch Condition size for update_attributes is too high" from houndci
  # because codeclimate already give that for us with more details
  Enabled: false

Layout/LineLength:
  Max: 125

Style/Alias:
  Enabled: false

Style/PerlBackrefs:
  Enabled: false

Layout/TrailingEmptyLines:
  Enabled: false

# Override the HoundCI custom rules (they do not use Rubocop defaults)
Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

Layout/ExtraSpacing:
  # disabling that in favour of using:
  # long_field_test_1 = 1
  # field_test_2      = 2
  # etc               = 3
  Enabled: false

Style/BlockDelimiters:
  Enabled: false

Style/CollectionMethods:
  Enabled: false

Style/SignalException:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/CommentAnnotation:
  Enabled: false

Layout/DotPosition:
  EnforcedStyle: leading

Style/GuardClause:
  Enabled: false

Style/RegexpLiteral:
  Enabled: false

Lint/SuppressedException:
  Enabled: false

Lint/AssignmentInCondition:
  Enabled: false

# The processor re-raises everything after running the exception handlers; the manager
# keeps it from reaching a custom launcher_executor's threads. The thread pool, the future
# and the concurrent send adapter run blocks on other threads: an error they let through
# (e.g. SystemStackError from a cyclic job argument) would kill the pool thread and leave
# the send unresolved, with no handler called
Lint/RescueException:
  Exclude:
    - 'lib/active_job/queue_adapters/shoryuken_concurrent_send_adapter.rb'
    - 'lib/shoryuken/helpers/future.rb'
    - 'lib/shoryuken/helpers/thread_pool.rb'
    - 'lib/shoryuken/manager.rb'
    - 'lib/shoryuken/processor.rb'

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/lib/shoryuken/processor_spec.rb'

Style/DoubleNegation:
  Enabled: false

Style/AndOr:
  Enabled: false

Style/ClassVars:
  Enabled: false

Style/GlobalVars:
  Enabled: false

Style/SingleLineBlockParams:
  Enabled: false

Style/RescueModifier:
  Enabled: false

Style/ColonMethodCall:
  Enabled: false

Naming/FileName:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/RescueStandardError:
  Enabled: false

Security/YAMLLoad:
  Enabled: false

Naming/MemoizedInstanceVariableName:
  Enabled: false

# Multi-line calls start their arguments on a new line, and close the parenthesis on its own line
# (Layout/MultilineMethodCallBraceLayout, symmetrical by default)
Layout/FirstMethodArgumentLineBreak:
  Enabled: true

# Multi-line calls get parentheses, so the two cops above apply to them too
Shoryuken/MultilineMethodCallParentheses:
  Enabled: true

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/FirstMethodParameterLineBreak:
  Enabled: true
