en:
  validations:
    options:
      missing: needs to be present
      format: is invalid
      concurrency_format: needs to be an Integer greater than 0
      delay_format: needs to be nil or a number greater than or equal to 0
      timeout_format: needs to be nil or a number greater than or equal to 0
      polling_strategy_format: needs to be nil, a String or a Class
      queues_format: needs to be nil or an Array of queue names or [name, weight] pairs
      groups_format: needs to be nil, a Hash or an Array of [name, options] pairs
      group_format: needs to be a Hash
      thread_priority_format: needs to be an Integer
      aws_format: needs to be a Hash
      lifecycle_events_format: needs to be a Hash
      config_file_format: needs to be nil, a String or a Pathname
      require_format: needs to be nil or a String
      logfile_format: needs to be nil or a String
      pidfile_format: needs to be nil or a String
      daemon_format: needs to be nil or a boolean
      rails_format: needs to be nil or a boolean
      verbose_format: needs to be nil or a boolean

    group:
      missing: needs to be present
      format: is invalid
      concurrency_format: needs to be nil or an Integer greater than 0
      delay_format: needs to be nil or a number greater than or equal to 0
      polling_strategy_format: needs to be nil, a String or a Class
      queues_format: needs to be nil or an Array of queue names or [name, weight] pairs

    worker:
      unknown: is not a known worker option
      body_parser_format: needs to be :json, :text, nil, a Proc or an object that responds to parse or load
